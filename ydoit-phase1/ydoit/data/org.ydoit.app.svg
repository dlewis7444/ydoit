<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c5cbf"/>
      <stop offset="100%" stop-color="#3a6dd9"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Keyboard body -->
  <rect x="8" y="28" width="112" height="72" rx="12" ry="12" fill="url(#bg)"/>

  <!-- Row 1: four keys -->
  <rect x="18" y="38" width="18" height="14" rx="3" fill="url(#key)"/>
  <rect x="40" y="38" width="18" height="14" rx="3" fill="url(#key)"/>
  <rect x="62" y="38" width="18" height="14" rx="3" fill="url(#key)"/>
  <rect x="84" y="38" width="28" height="14" rx="3" fill="url(#key)"/>

  <!-- Row 2: four keys -->
  <rect x="18" y="56" width="22" height="14" rx="3" fill="url(#key)"/>
  <rect x="44" y="56" width="18" height="14" rx="3" fill="url(#key)"/>
  <rect x="66" y="56" width="18" height="14" rx="3" fill="url(#key)"/>
  <rect x="88" y="56" width="22" height="14" rx="3" fill="url(#key)"/>

  <!-- Row 3: spacebar row -->
  <rect x="18" y="74" width="14" height="14" rx="3" fill="url(#key)"/>
  <rect x="36" y="74" width="56" height="14" rx="3" fill="url(#key)"/>
  <rect x="96" y="74" width="14" height="14" rx="3" fill="url(#key)"/>
</svg>
