<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Keyboard outline -->
  <rect x="1" y="3" width="14" height="10" rx="1.5" ry="1.5"
        fill="none" stroke="currentColor" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="3"  y="5" width="2" height="1.5" rx="0.3" fill="currentColor"/>
  <rect x="6"  y="5" width="2" height="1.5" rx="0.3" fill="currentColor"/>
  <rect x="9"  y="5" width="2" height="1.5" rx="0.3" fill="currentColor"/>
  <rect x="12" y="5" width="1.5" height="1.5" rx="0.3" fill="currentColor"/>

  <!-- Row 2 -->
  <rect x="3"  y="7.5" width="1.5" height="1.5" rx="0.3" fill="currentColor"/>
  <rect x="5.5" y="7.5" width="2" height="1.5" rx="0.3" fill="currentColor"/>
  <rect x="8.5" y="7.5" width="2" height="1.5" rx="0.3" fill="currentColor"/>
  <rect x="11.5" y="7.5" width="2" height="1.5" rx="0.3" fill="currentColor"/>

  <!-- Row 3: spacebar -->
  <rect x="3" y="10" width="1.5" height="1.5" rx="0.3" fill="currentColor"/>
  <rect x="5.5" y="10" width="5" height="1.5" rx="0.3" fill="currentColor"/>
  <rect x="11.5" y="10" width="1.5" height="1.5" rx="0.3" fill="currentColor"/>
</svg>
