[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ydoit"
version = "2.0.0"
description = "Keyboard shortcut auto-typer for GNOME/Wayland"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "ydoit contributors"},
]
keywords = ["gnome", "keyboard", "shortcut", "wayland", "autotype"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Utilities",
]
dependencies = [
    # PyGObject, GTK4, libadwaita, libsecret are system packages
    # installed via dnf/apt, not pip. No pip dependencies needed.
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
ydoit = "ydoit.cli:main"
ydoit-gui = "ydoit.app:main"

[project.urls]
Homepage = "https://github.com/dlewis7444/ydoit"
Repository = "https://github.com/dlewis7444/ydoit"
Issues = "https://github.com/dlewis7444/ydoit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# gi.require_version() must be called before gi.repository imports (PyGObject pattern)
"src/ydoit/app.py" = ["E402"]
"src/ydoit/entry_editor.py" = ["E402"]
"src/ydoit/passphrase_dialog.py" = ["E402"]
"src/ydoit/settings_page.py" = ["E402"]
"src/ydoit/window.py" = ["E402"]

[tool.coverage.run]
source = ["ydoit"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 45
